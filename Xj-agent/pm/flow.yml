name: pm
description: PM全流程研发调度中枢（13 节点流程 · 公开骨架版，引擎接线默认 Xj-engine）
aliases:
- /pm
# ============================================================
# 引擎归属：默认 Xj-engine（Python 包 engine / CLI xj-engine）。
# 端点/组件明细见 pm/SKILL.md「引擎归属」节（唯一权威，本文件不重复书写）；离线禁降级。
# 统一入口为引擎 et 契约（ET Payload，禁带 expression）；
# 状态推进两步——先 et 判定（state_intercept.allowed_pairs）→ success 后
# 落库状态（双写状态存储+审计）；签发走 et 的 content_issue 块（引擎三元组签名）。
# 引擎为可插拔，通过环境变量切换（见 SKILL.md / scripts/engine_preflight.sh）。
# ============================================================
engine_name: Xj-engine
engine_api: engine.kernel.et
input_schema:
  type: object
  required:
  - input
  properties:
    input:
      type: string
      description: 输入给PM工作流的项目需求或指令
rules:
# 软引导（无法 0/1 判定的部分）；硬规则全部由引擎执行
- 需求不清 → 主动找用户沟通直到清晰；需求清晰 → 全程自动推进
- 用户只参与两点：① 需求方向确认（停点1） ② 重构确认（影响>3文件时）
- 项目收尾触发流程C，输出经验沉淀与配置变更
- 缺陷一律走流程B（分级→修复→复核→回归），流程B 失败回流不进入下游
agents:
# ============================================================
# 步骤1 · PM 项目经理：宣布启动
# ============================================================
# ============================================================
# 全局横切规则（全节点生效，节点内不再重复书写）
# ① archmap 上下文：凡 pm_plan.json 含 archmap_analysis 字段，各角色开工前必读并按影响面调整产出（spm→PRD体现变更范围 / dpm→调整页面结构状态机接口契约 / fe→定位受影响页面组件 / be→覆盖受影响模块接口存储）
# ② sv-supervisor 审批：凡交付物提交前须经 sv-supervisor 审批（sv_verdict=APPROVED），未审批禁止流转
# ③ 角色权威定义：各节点角色能力以 invoked_skills 指向的技能 SKILL.md 为唯一权威，本文件 identity 只写节点特有契约，禁止复制角色 SKILL.md 内容
# ④ engine 离线：门禁与签发不可用，必须先启动引擎（默认 xj-engine），禁止静默降级为软执行
# ============================================================
- name: pm_bootstrap
  display_name: 项目经理·宣布启动
  identity: '# pm_bootstrap — 项目经理（宣布启动）
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：项目路径/压缩包。前置硬性加载（缺任意一项→禁止进入步骤1）：创建/恢复 .flow_state.json 断点（status=PENDING/step=STEP-01）、输出 `[sv-supervisor rules loaded]` 声明。
    输入校验：项目根必须存在 .prd.md + .ui-proto.json，缺失任一→流程冻结，要求补齐。
    archmap 三路分流（本节点专属契约）：已有基线→/archmap 影响面分析结果写入 pm_plan.json；存量项目无基线→先 /archmap 全量建基线再做分析；全新空白项目→置 null 并注明。调用失败→暂停流程（pm 节点唯一 Bash 例外）。
    本节点职责：宣布启动、判定档位 S/M/L、输出流程状态条；不写代码、不做设计、不执行测试。
    禁止：跳过前置输入校验直接启动；直接指派开发/测试角色；输出代码/接口/SQL。'
  harness_sync:
  - state: PENDING
    title: 规则加载完成
  - state: PRD_REVIEW
    title: 项目宣布启动，进入需求分析
  next_agents:
  - spm
  deliverables:
  - filename: pm_plan.json
    template: '{"type":"object","required":["project_name","flow_type","size_gear","assigned_roles","next_steps"],"properties":{"project_name":{"type":"string"},"flow_type":{"type":"string"},"size_gear":{"type":"string","enum":["S","M","L"]},"assigned_roles":{"type":"array","items":{"type":"string"}},"next_steps":{"type":"array","items":{"type":"string"}},"archmap_analysis":{"type":["object","array","null"]}}}'
  branch_conditions:
    completed_pass: spm
    input_missing: __freeze__
  self_checks:
  - .flow_state.json 已创建或断点已恢复
  - sv-supervisor 规则已加载并输出声明
  - .prd.md + .ui-proto.json 校验通过（有项目输入时）
  - 档位 S/M/L 已判定
  - Harness 状态同步已执行
  permissions:
    forbid:
    - skip_input_validation
    - direct_assign_dev_test
    - output_code
# ============================================================
# 步骤2 · SPM 大产品经理：需求分析
# ============================================================
- name: spm
  invoked_skills:
  - senior-pm-agent
  display_name: 大产品经理·需求分析
  identity: '# spm — 大产品经理
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：.prd.md（全项目概览+技术栈+需求清单），按需读 .ui-proto.json；输出《总需求PRD》（六要素齐全）。
    ⛔ 停点1（用户确认）：先输出方向摘要 → 等用户确认 → 再输出完整 PRD。
    禁止：跳过六要素任一项；在用户确认方向前输出完整 PRD；输出可执行代码/数据库DDL/API定义。'
  harness_sync:
  - state: PRD_REVIEW
    title: 需求分析完成
  next_agents:
  - pm_prd_confirm
  deliverables:
  - filename: prd.md
    template: '{"type":"object","required":["status","content"],"properties":{"status":{"type":"string"},"content":{"type":"string"}}}'
  branch_conditions:
    completed_pass: pm_prd_confirm
  self_checks:
  - PRD 六要素完整
  - KANO+ROI 分析完成（每条需求标注分类+优先级）
  - 停点1：用户已确认方向
  - sv-supervisor 审批通过（sv_verdict=APPROVED）
  - 复盘学习模式专属：新技能条目已落盘经验库 entries/ 且登记入 registry.json，并经机械校验判 A（判 B=未固化，禁止汇报"已入技能表"）
  permissions:
    forbid:
    - skip_prd_six_elements
    - output_code
# ============================================================
# 步骤3 · PM 确认PRD + task_breakdown 任务分片
# ============================================================
- name: pm_prd_confirm
  invoked_skills:
  - senior-pm-agent
  display_name: PM确认PRD·任务分片
  identity: '# pm_prd_confirm — PM 确认PRD + task_breakdown
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：spm 产出的 prd.md。审核 PRD 完整性通过后调用 task-breakdown：按 S/M/L 拆解任务，标注技术栈/估时/验收标准/依赖，无依赖任务标记并行，输出拆解表。
    禁止：跳过审批直接下发；修改已确认的 PRD 内容。'
  harness_sync:
  - state: PRD_REVIEW
    title: PRD确认与任务拆解完成
  next_agents:
  - dpm
  deliverables:
  - filename: task_slice_plan.json
    template: '{"type":"object","required":["size_gear","enable_clone","slice_list","merge_requirement"],"properties":{"size_gear":{"type":"string"},"enable_clone":{"type":"boolean"},"slice_list":{"type":"array","items":{"type":"object"}},"merge_requirement":{"type":"string"}}}'
  branch_conditions:
    completed_pass: dpm
  self_checks:
  - PRD 完整性审核通过
  - 任务拆解含估时/验收标准/依赖标注
  - 无依赖任务已标记并行
  - sv-supervisor 审批通过
  permissions:
    forbid:
    - skip_sv_handshake
# ============================================================
# 步骤4 · DPM 细节产品经理：交互设计
# ============================================================
- name: dpm
  invoked_skills:
  - detail-product-manager
  display_name: 细节产品经理·交互设计
  identity: '# dpm — 细节产品经理
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：已确认 PRD；先质疑闭环，再输出《详细交互设计文档》（9章节+状态机100%完整）。
    节点特有契约：第10节字段约束表（field/testid/min/max/校验提示）为 UI 测试边界取值唯一来源；同步产出 api_contract.json 作前后端接口契约基线。
    禁止：跳过状态机任一种状态；缺第10节字段约束表；输出生产代码/数据库迁移/API实现。'
  harness_sync:
  - state: DESIGN
    title: 交互设计完成
  next_agents:
  - ui_designer
  - test_lead_design
  parallel_group: design_and_test_design
  deliverables:
  - filename: interaction_design.md
    template: '{"type":"object","required":["status","content"],"properties":{"status":{"type":"string"},"content":{"type":"string"}}}'
  - filename: api_contract.json
    template: '{"type":"object","required":["status","endpoints"],"properties":{"status":{"type":"string"},"endpoints":{"type":"array","items":{"type":"object"}}}}'
  branch_conditions:
    completed_pass: __parallel_design_and_test_design__
  self_checks:
  - 质疑闭环完成
  - 状态机100%完整
  - 第10节字段约束表已产出（UI测试边界来源）
  - api_contract.json 已定稿
  - sv-supervisor 审批通过
  - 复盘学习模式专属：dpm 新技能条目已落盘经验库 entries/ 且登记入 registry.json，并经机械校验判 A（判 B=未固化，禁止汇报"已入技能表"）
  permissions:
    forbid:
    - skip_state
    - output_production_code
# ============================================================
# 步骤5a · ui-designer 界面设计师（并行）
# ============================================================
- name: ui_designer
  invoked_skills:
  - ui-designer
  display_name: 界面设计师·视觉规范
  identity: '# ui_designer — 界面设计师
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：DPM 交互设计文档；输出 ui_spec.md（颜色/字体/间距/圆角/阴影 5 系统 + 每组件7种状态，全部数值化描述），前端验收后流转。
    禁止：生成图片/设计稿文件；非数值化描述；修改前端代码。'
  harness_sync:
  - state: DEV_FRONTEND
    title: 视觉设计与用例设计完成
  parallel_group: design_and_test_design
  next_agents:
  - fe
  deliverables:
  - filename: ui_spec.md
    template: '{"type":"object","required":["status","content"],"properties":{"status":{"type":"string"},"content":{"type":"string"}}}'
  branch_conditions:
    completed_pass: __wait_test_lead_design__
  self_checks:
  - 5系统全覆盖（颜色/字体/间距/圆角/阴影）
  - 每个组件7种状态完整
  permissions:
    forbid:
    - generate_image
    - modify_frontend_code
# ============================================================
# 步骤5b · test-lead 测试负责：并行下发三路测试设计（并行）
# ============================================================
- name: test_lead_design
  invoked_skills:
  - test-lead
  - whitebox-coverage
  - api-test-engineer
  - ui-test-engineer
  display_name: test-lead·三路测试设计下发
  identity: '# test_lead_design — 测试负责（设计阶段）
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：PRD/原型/源码就绪信号。三路前置逐路核验——白盒路=源码可测+coverage 基线可读；接口路=.api-schema.json 存在（唯一权威输入）；UI 路=.prd.md + .ui-proto.json + DPM 第10节字段约束表齐备。
    节点特有契约：一条消息并行下发三路测试设计；缺一路门禁→该路不下发、其余路正常并行，收口标注缺口原因。用例语义审核通过 → 引擎 et 契约机械校验（artifact_validate/gate_guard 块）→ et content_issue 块签发 global_batch_id + CROSS_VALIDATION_HASH 写入 batch_meta.json（引擎三元组签名）。
    禁止：自行签发/自行算签名（签发只能走引擎 content_issue 块）；执行用例（设计≠执行）；编造测试数据/边界值。'
  # harness_sync 说明：并行组同状态只同步一次——DEV_FRONTEND 由 ui_designer 节点同步（2026-08-15 B2 修复），本节点不重复回执
  parallel_group: design_and_test_design
  next_agents:
  - fe
  deliverables:
  - filename: execution-list.json
    template: '{"type":"object","required":["global_batch_id","execution_mode","cases"],"properties":{"global_batch_id":{"type":"string"},"execution_mode":{"type":"string"},"cases":{"type":"array","items":{"type":"object"}}}}'
  - filename: batch_meta.json
    template: '{"type":"object","required":["global_batch_id","cross_validation_hash","baseline_diff_hash","env_label"],"properties":{"global_batch_id":{"type":"string"},"cross_validation_hash":{"type":"string"},"baseline_diff_hash":{"type":"string"},"env_label":{"type":"string"}}}'
  branch_conditions:
    completed_pass: __wait_ui_designer__
  self_checks:
  - 三路前置门禁逐路核验（缺口已标注原因）
  - 用例含 source_node/source_branch/test_methods 三要素
  - smoke:true 标注 5-8 个 P0 核心场景
  - 引擎 et 机械校验（artifact_validate/gate_guard 块）通过
  - 引擎 et content_issue 签发回执已写入 batch_meta.json
  # 四门禁（用例格式 / 证据链 / 交叉隔离 / 批次签发）全部走引擎 et 契约（Xj-engine）。
  # 响应为新内核出参：code ∈ success/reject/block/timeout/error，细节看 validate_result/issue_meta/failure_info；
  # 非 success 一律不得推进。批次签发 issue_meta.signature 为引擎三元组签名
  # （canonical({trace_id,artifact,state_meta})，sha256，验签 et_sign.verify_issue）；
  # Agent 禁止自算签名。
  - sv-supervisor 审批测试就绪
  permissions:
    forbid:
    - self_sign_batch
    - execute_test
    - fabricate_data
# ============================================================
# 步骤6a · FE 前端工程师
# ============================================================
- name: fe
  invoked_skills:
  - frontend-development
  display_name: 前端工程师·组件实现
  identity: '# fe — 前端工程师
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：ui_spec.md + interaction_design.md（含第10节字段约束表）。
    节点特有契约：必须注入 data-testid 锚点，取值与 .ui-proto.json 组件 id 一一对应（UI 测试 element_description 按 data-testid > id > name > xpath 优先级取值）；自测通过后执行导入验证门禁。
    禁止：修改后端接口契约；跳过 npm run build 验证；漏注 data-testid 锚点；超范围开发。'
  harness_sync:
  - state: DEV_BACKEND
    title: 前端开发完成
  next_agents:
  - be
  deliverables:
  - filename: frontend_status.json
    template: '{"type":"object","required":["status","deliverables","smoke_result"],"properties":{"status":{"type":"string"},"deliverables":{"type":"array","items":{"type":"string"}},"smoke_result":{"type":"string"}}}'
  branch_conditions:
    completed_pass: be
  self_checks:
  - npm run build 成功 + 控制台零错误
  - 4种状态完整 + 视觉偏差≤2px
  - data-testid 锚点与 .ui-proto.json 组件id 一一对应
  - 导入验证/跨文件审计/依赖同步已执行
  permissions:
    forbid:
    - modify_backend_contract
    - skip_build_verify
    - over_scope_dev
# ============================================================
# 步骤6b · BE 后端工程师
# ============================================================
- name: be
  invoked_skills:
  - backend-engineer
  display_name: 后端工程师·接口实现
  identity: '# be — 后端工程师
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：api_contract.json（接口契约先定再实现，自测通过才提测）。
    节点特有契约：产出 .api-schema.json（schema 2.0：接口全集+场景分母+fields 约束），作为接口测试路唯一权威输入。
    禁止：跳过接口契约定义；凭记忆调用第三方库 API；静默吞异常；使用 Tkinter/PyQt/PySide（技术黑名单）。'
  harness_sync:
  - state: PM_CONFIRM
    title: 后端开发完成
  next_agents:
  - pm_quality_gate
  deliverables:
  - filename: backend_status.json
    template: '{"type":"object","required":["status","deliverables","smoke_result"],"properties":{"status":{"type":"string"},"deliverables":{"type":"array","items":{"type":"string"}},"smoke_result":{"type":"string"}}}'
  - filename: .api-schema.json
    template: '{"type":"object","required":["schema_version","endpoints"],"properties":{"schema_version":{"type":"string"},"endpoints":{"type":"array","items":{"type":"object"}}}}'
  branch_conditions:
    completed_pass: pm_quality_gate
  self_checks:
  - .api-schema.json 已产出（接口测试路权威输入）
  - 接口契约先于实现
  - 导入验证/跨文件审计/依赖同步已执行
  - 自测通过
  permissions:
    forbid:
    - skip_api_contract
    - silent_exception_swallow
# ============================================================
# 步骤7-9 · PM：代码审查 + 自测确认 + 冒烟门禁（质量左移）
# ============================================================
- name: pm_quality_gate
  invoked_skills:
  - test-lead
  display_name: PM·代码审查+自测确认+冒烟门禁
  identity: '# pm_quality_gate — PM 质量门禁（提测前）
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：前后端自测报告与交付物。三段门禁：①代码审查（五维+新增4项：导入验证/跨文件审计/依赖同步/配置文档同步），不通过打回开发修复；②自测确认；③冒烟门禁（test-executor 仅执行 smoke:true 的 5-8 个 P0 核心场景）。
    冒烟分流：全部通过→全量测试；有失败→直接触发流程B，不进入全量测试。冒烟报告必须携带 round 字段；首轮失败触发轮内回归时保留 smoke_test_report.r1.json 快照。
    禁止：审查/自测未通过时放行冒烟；冒烟失败仍进入全量测试。'
  harness_sync:
  - state: CODE_REVIEW
    title: 代码审查通过
  - state: SMOKE_TEST
    title: 冒烟测试完成
  next_agents:
  - test_lead_full
  deliverables:
  - filename: code_review_report.json
    template: '{"type":"object","required":["status","issues","conclusion"],"properties":{"status":{"type":"string"},"issues":{"type":"array","items":{"type":"object"}},"conclusion":{"type":"string"}}}'
  - filename: smoke_test_report.json
    template: '{"type":"object","required":["status","pass_rate","failed_modules"],"properties":{"status":{"type":"string"},"pass_rate":{"type":"number"},"failed_modules":{"type":"array","items":{"type":"string"}}}}'
  branch_conditions:
    completed_pass: test_lead_full
    smoke_failed: __flow_b__
    review_failed: fe
  self_checks:
  - 五维审查+新增4项全部通过
  - 自测报告经 sv-supervisor 审批
  - 冒烟仅执行 smoke:true 用例（5-8个P0）
  - 冒烟失败已触发流程B（不进入全量）
  permissions:
    forbid:
    - pass_without_review
    - enter_full_test_with_smoke_failure
# ============================================================
# 步骤10 · test-lead 全量测试：下发 → 语义审核 → 收口（引擎门禁把关）
# ============================================================
- name: test_lead_full
  invoked_skills:
  - test-lead
  - whitebox-coverage
  - api-test-engineer
  - ui-test-engineer
  display_name: test-lead·全量测试三路收口
  identity: '# test_lead_full — 测试负责（全量阶段）
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：冒烟通过的交付物 + batch_meta.json；一条消息并行下发三路全量测试，逐路串行走引擎门禁。
    白盒路双基线分流（本节点专属契约，2026-08-14 新增）：archmap/full_index.json + test-master-report.json（R0→R3 完成）均存在且本次为版本更新回归→下发 diff 增量模式（执行范围唯一依据 archmap/diff_impact.json，禁止下令全量）；无测试基线→全量 R0 基线→R1-R3 分层轮次→终判报告（首版唯一例外）。
    收口：三路结果聚合 → Q5 语义抽审 → 引擎 et 契约（artifact_validate 证据链 + gate_guard 交叉隔离校验块）→ test-master-report.json + defect-auto-grade.json；POST_GATE_AUDIT 抽样复核。
    轮次规则：报告必须携带 round 字段（首轮=1，回归每轮+1）；r1 快照保留，retro 前禁止覆写。
    分流：全部通过→部署；有失败→流程B（缺陷回流，失败回流不进入下游）。
    禁止：自行签发/改判引擎门禁结果；替下游写用例/执行/改代码。'
  harness_sync:
  - state: FULL_TEST
    title: 全量测试完成
  next_agents:
  - ops
  deliverables:
  - filename: test-master-report.json
    template: '{"type":"object","required":["status","pass_rate","routes","failed_cases"],"properties":{"status":{"type":"string"},"pass_rate":{"type":"number"},"routes":{"type":"object"},"failed_cases":{"type":"array","items":{"type":"object"}}}}'
  - filename: defect-auto-grade.json
    template: '{"type":"object","required":["defects"],"properties":{"defects":{"type":"array","items":{"type":"object","required":["defect_id","grade","is_repeat"],"properties":{"defect_id":{"type":"string"},"grade":{"type":"string","enum":["P0","P1","P2","P3"]},"is_repeat":{"type":"boolean"},"root_cause":{"type":"string"}}}}}}'
  branch_conditions:
    completed_pass: ops
    has_failure: __flow_b__
  self_checks:
  - 三路全部回报并聚合（缺口已标注）
  - 引擎 et 证据链 + 交叉隔离校验块（artifact_validate/gate_guard）裁决通过
  - test-master-report.json + defect-auto-grade.json 已生成（含 is_repeat 重复Bug标注）
  - POST_GATE_AUDIT 抽样复核完成
  permissions:
    forbid:
    - self_sign_batch
    - override_engine_verdict
# ============================================================
# 步骤12 · OPS 运维部署
# （顺序说明：引擎状态机 DEPLOY→ACCEPTANCE 为唯一合法流向，验收在部署后做最终判定，
#  保证 transition 落库衔接不被 state_intercept.allowed_pairs 判非法跃迁 block）
# ============================================================
- name: ops
  invoked_skills:
  - operation-deployment
  display_name: 运维部署·本地打包
  identity: '# ops — 运维部署
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：前后端交付物与测试报告均齐备。
    节点特有契约：ZIP 前强制预交付验证六项（文件同步diff比对/语法检查/导入检查/bat编码无中文/文件清单核验/页面渲染检查）；ZIP 仅源码+工程配置、文件名含版本号 v{主}.{次}.{修订}[-标签]，bat 脚本全英文（@echo off + chcp 65001）。
    禁止：测试报告不齐备时部署；ZIP 含非源码文件（PRD/原型/测试报告）。'
  harness_sync:
  - state: DEPLOY
    title: 部署完成
  next_agents:
  - qa
  deliverables:
  - filename: deployment_record.json
    template: '{"type":"object","required":["status","version","backup_path","verification_result"],"properties":{"status":{"type":"string"},"version":{"type":"string"},"backup_path":{"type":"string"},"verification_result":{"type":"string"}}}'
  branch_conditions:
    completed_pass: qa
  self_checks:
  - 预交付验证六项全部通过
  - ZIP 仅源码+配置且含版本号
  - 启动验证通过
  permissions:
    forbid:
    - zip_contains_non_source
# ============================================================
# 步骤13 · acceptance-manager 验收经理
# ============================================================
- name: qa
  invoked_skills:
  - test-lead
  display_name: 验收经理·最终判定
  identity: '# qa — 验收经理
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：test-master-report.json + acceptance_report.json + PRD；通过/打回二值判定（只判定，不排查Bug），P0/P1 未解决→强制不通过。
    节点特有契约：P0 验收标准 100% 逐项核查 + P1/P2 随机抽样 ≥20%；必须记录 checked_items/total_items 写入验收报告（qa_coverage 由引擎机械校验，<0.8 拒签）。
    分流：通过→触发流程C；不通过→打回触发流程B。
    禁止：排查Bug（只判定）；放行不合格交付物；直接指派开发修复。'
  harness_sync:
  - state: ACCEPTANCE
    title: 验收完成
  next_agents:
  - process_audit
  deliverables:
  - filename: acceptance_report.json
    template: '{"type":"object","required":["status","verdict","notes","checked_items","total_items"],"properties":{"status":{"type":"string"},"verdict":{"type":"string"},"notes":{"type":"string"},"checked_items":{"type":"integer"},"total_items":{"type":"integer"}}}'
  branch_conditions:
    completed_pass: process_audit
    rejected: __flow_b__
  self_checks:
  - 对照 PRD 逐项核查完成
  - 抽样验证完成
  - P0/P1 未解决时已强制不通过
  - checked_items/total_items 已记录（qa_coverage 数据源）
  permissions:
    forbid:
    - debug_bug
    - pass_unqualified
# ============================================================
# 步骤13.5 · process-audit 流程合规审计（2026-08-15 R4 接线：qa 之后、retro 之前）
# ============================================================
- name: process_audit
  invoked_skills:
  - test-lead
  display_name: 流程审计·合规后置审计
  identity: '# process_audit — 独立流程审计
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：验收通过后的全流程数据（Harness 实例状态/签名链/violations/逐步骤交付物）。
    节点特有契约：七维审计 A-G（状态一致性/交付物完整性/违规范/同步日志/第5层固化/技能产出完整性/经验复用率）；F/G 维度机械闸（process_audit_f/process_audit_g）已于 2026-08-20 问题闸全量复审裁定撤除（结构性失效：阈值永久判B/检查已废止字段，且由写入端活闸兜底），F/G 维度留软层语义审查；综合结论二值（通过/不通过），不通过→风险项全量写入报告。
    禁止：参与任何代码/UI/测试判断；修改或淡化审计结果；跳过任一维度；PM 无权跳过本节点。'
  harness_sync:
  - state: ACCEPTANCE
    title: 流程合规审计完成
  next_agents:
  - retro
  deliverables:
  - filename: process_audit_report.json
    template: '{"type":"object","required":["status","conclusion","dimensions","risks"],"properties":{"status":{"type":"string"},"conclusion":{"type":"string","enum":["通过","不通过"]},"dimensions":{"type":"object"},"risks":{"type":"array","items":{"type":"object"}}}}'
  branch_conditions:
    completed_pass: retro
  self_checks:
  - 七维审计 A-G 全部执行（无跳维）
  - F/G 维度经 gate_switch 机械判定（非手写）
  - process_audit_report.json 已产出（含结论+风险项）
  - 审计结果未被 PM 修改
  permissions:
    forbid:
    - modify_audit_result
    - skip_dimension
    - join_dev_test_judgement
# ============================================================
# 步骤14 · 流程C 收尾（sv-supervisor 复核门禁）
# ============================================================
- name: retro
  invoked_skills:
  - retro-skill-dispatcher
  display_name: 流程C收尾·复盘归档
  identity: '# retro — 流程C 项目收尾
    角色能力权威定义见 invoked_skills 指向的 SKILL.md。
    输入：验收通过的交付物 + 各角色最短路径记录（问题/方案/预防/适用场景）。
    变更台账卡点（本节点专属契约）：项目根存在 archmap/full_index.json 且本次有代码变更→复盘前必须先 /archmap <项目路径> diff 留痕（diff_history.jsonl + 10_变更历史.md）；归档前 /archmap sync 刷新基线并回补 01~09 分析文档。无基线或纯文档流程豁免，须在 retro_report.json 注明豁免原因。
    收尾程序：5问法三层穿透复盘 → retro-skill-dispatcher GENERATE 经验入库 → 补丁分发前置门禁（规则/机制/流程类补丁逐条过 REFORM-GATE 判 A 才允许分发，纯经验沉淀类豁免）→ sv-supervisor 复核 APPROVED 才归档 CLOSED。
    禁止：验收未通过时收尾；复盘无落地动作；跳过复核直接归档；有代码变更却未做 archmap diff 留痕即复盘（豁免须注明）。'
  harness_sync:
  - state: ACCEPTANCE
    title: 流程A完成，触发收尾
  - state: CLOSED
    title: sv-supervisor复核APPROVED，归档关闭
  next_agents: []
  deliverables:
  - filename: retro_report.json
    template: '{"type":"object","required":["status","lessons","action_items"],"properties":{"status":{"type":"string"},"lessons":{"type":"array","items":{"type":"object"}},"action_items":{"type":"array","items":{"type":"string"}}}}'
  branch_conditions:
    sv_approved: __end__
    sv_rejected: retro
  self_checks:
  - 变更台账已留痕（archmap/diff_history.jsonl 存在本次记录，或已注明豁免原因）
  - 验收通过后已执行 /archmap sync 回补 01~09 分析文档（豁免同上）
  - 5问法三层穿透独立输出
  - 经验已入库（经验库索引+角色绑定已更新），且机械校验通过：bash scripts/verify_experience_writeback.sh <retro_report.json路径> <经验库索引文件>（mtime 双验证，不通过=未入库，禁止声称已沉淀）
  - 补丁已分发（规则/机制/流程类补丁逐条附 reform_gate 判A留痕，纯经验沉淀类豁免）
  - 经验空壳审计：本次流程涉及角色的经验文档逐一机械校验非空壳（<200B 视为空壳），空壳角色须在 retro_report.json 中点名（补齐或标注"无经验"）
  - process_audit 综合结论=通过（不通过则风险项已全部处置并在 retro_report.json 注明处置方式，2026-08-15 R4 接线）
  - sv-supervisor 复核结论=APPROVED
  permissions:
    forbid:
    - retro_without_acceptance
    - no_landing_action
    - skip_sv_review
# ============================================================
# 流程B 缺陷回流（旁路，不进入下游）
# ============================================================
flow_b:
  trigger: 发版后用户反馈的问题（CLOSED 后触发；轮内失败=轮内回归，不进流程B）
  chain: test-lead 归属分析（标注是否重复Bug）→ sv-supervisor 确认指派 → 对应开发修复（bug-fix-strategy 5级优先级，解决即停）→ 补充用例精准回归 → test-lead 语义审核 + 引擎机械门禁 → sv-supervisor 终审 → 回归通过收口
  rules:
  - 前端修复 → 只回归该页面UI用例+相邻交互
  - 后端修复 → 只回归该接口用例+依赖前端场景
  - 基础设施变更 → 强制全量回归
  - 超过2轮未关闭 → PM 要求 5-Why 根因分析报告
  - 流程B 失败回流不进入下游
  harness_sync:
  - state: ROLLBACK
    title: 用户反馈问题，流程B启动（CLOSED→ROLLBACK 重开）
  - state: CLOSED
    title: 修复验收通过，回归关闭（ROLLBACK→CLOSED）
state_model:
  deliverable_reg:
    meta:
      version: 4.0.0
    note: 交付物逐个经引擎 et 契约判定（content_issue 引擎三元组签名），code==success 后再落库状态才算状态推进；非 success 时 new_task_state=null，无 success 回执视为未推进
    security_id_format: SEC-{flow_id}-{node_id}-{sha256[:16]}
  # 状态机跃迁表（2026-08-16 盘活为规则入参，flow_kernel.py 机械校验唯一依据；
  # 16 态全表即 state_intercept.allowed_pairs 的跃迁来源，改流程改这里，不改内核）
  transitions:
    PENDING: [PRD_REVIEW, FROZEN]
    PRD_REVIEW: [DESIGN, FROZEN]
    DESIGN: [DEV_FRONTEND, DEV_BACKEND, WAIT_BRANCH_AGGREGATE, FROZEN]
    WAIT_BRANCH_AGGREGATE: [SCAN_NEXT_BATCH, EXIT_PARALLEL_ZONE, DEV_FRONTEND, DEV_BACKEND, FROZEN]
    SCAN_NEXT_BATCH: [WAIT_BRANCH_AGGREGATE, DEV_FRONTEND, DEV_BACKEND, FROZEN]
    EXIT_PARALLEL_ZONE: [PM_CONFIRM, FROZEN]
    DEV_FRONTEND: [DEV_BACKEND, PM_CONFIRM, FROZEN]
    DEV_BACKEND: [PM_CONFIRM, FROZEN]
    PM_CONFIRM: [CODE_REVIEW, SMOKE_TEST, FROZEN, ROLLBACK]
    SMOKE_TEST: [FULL_TEST, CODE_REVIEW, FROZEN]
    FULL_TEST: [DEPLOY, CODE_REVIEW, FROZEN]
    CODE_REVIEW: [SMOKE_TEST, DEPLOY, FROZEN, ROLLBACK]
    DEPLOY: [ACCEPTANCE, FROZEN]
    ACCEPTANCE: [CLOSED, FROZEN, ROLLBACK]
    CLOSED: [FROZEN, ROLLBACK]
    FROZEN: [ROLLBACK]
    ROLLBACK: [PENDING, CODE_REVIEW, PM_CONFIRM, CLOSED]
  harness_states:
  - PENDING
  - PRD_REVIEW
  - DESIGN
  - DEV_FRONTEND
  - DEV_BACKEND
  - PM_CONFIRM
  - CODE_REVIEW
  - SMOKE_TEST
  - FULL_TEST
  - DEPLOY
  - ACCEPTANCE
  - CLOSED
  - FROZEN
  - ROLLBACK
