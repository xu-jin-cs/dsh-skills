# ETL Engine Standalone — 即插即用配置面（唯一入口；引擎规则真源仍在 engine/contract_rules/*.yaml）
# 本文件为中间件与部署参数清单；引擎内部存储/分片/清洗参数请改 contract_rules，勿双写。

embedding:                        # 只写模型名，首跑由 sentence-transformers 自动拉取权重
  model_name: BAAI/bge-m3
  dimension: 1024
  device: mps                     # cuda / cpu 按环境改
  batch_size: 50

storage:                          # 与 contract_rules/storage.yaml 对齐（相对包根）
  lancedb_uri: ./data/vector/general_doc_db
  lancedb_table: general_doc_chunks
  sqlite_path: ./data/general_etl.db
  bm25_index_dir: ./data/bm25
  tmp_dir: ./data/tmp/general_upload

rabbitmq:                         # 拓扑契约详见 docs/etl_async_contract.md
  host: 127.0.0.1
  port: 5672
  vhost: /etl
  exchange: etl_exchange    # direct, durable
  queue: etl_vector_index_task   # durable, TTL=1800000ms, 无界
  dlq: etl_vector_index_dlq
  routing_key: vector.index.task
  prefetch: 4
  consumer_threads: 6

redis:
  host: 127.0.0.1
  port: 6379
  idem_key_pattern: "etl:index:done:{task_id}"   # SET NX EX 7天
  sent_key_pattern: "etl:mq:sent:{task_id}"      # EX 86400

minio:
  bucket: etl-raw           # 原始对象=对账基准源，禁删

reconciler:
  interval_s: 300

prometheus:
  rules_file: middleware/prometheus_rules/etl_engine.yaml
