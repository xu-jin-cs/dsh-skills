[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xj-engine"
version = "0.1.0"
description = "Xj-rules 配套的通用默认 AgentEngine（独立于 agent-harness 平台）"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.scripts]
xj-engine = "xj_engine.cli:main"

[tool.setuptools]
packages = ["xj_engine"]
