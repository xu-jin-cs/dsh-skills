# isolation.yaml — 隔离红线 + 每条红线的 CI 机械断言 spec（standalone 版，
# 断言目标全部指向本包 engine/general 与 contract_rules）
# 迁移依据：历史规则迁移台账 表3-D1（「隔离红线」6 条提取）
# spec 原语对齐 gate-switch：grep_count(模式出现次数断言) / glob_count(文件数断言) / json_field(字段存在性断言)
# 执行方式：CI 将本表 spec 逐条展开为 gate-switch 检查项，任一失败禁止合并（契约 §四-4）

red_lines:
  - id: ISO-1
    name: 目录隔离
    rule: general 族全部逻辑只位于 engine/general/ 与 engine/contract_rules/；历史族既有文件不被 general 族染指
    spec:
      primitive: glob_count
      target: engine/general/*.py
      expect_gte: 1
      note: general 实现层文件必须存在且收拢于该目录

  - id: ISO-2
    name: import 隔离
    rule: engine/general/ 下任何文件禁止 import 历史引擎/存量 PDF 资产（pdf_storage、PdfDocument、DatasetChunkMeta 等旧模块）
    spec:
      primitive: grep_count
      target: engine/general/*.py
      pattern: 'pdf_storage|PdfDocument|DatasetChunkMeta|from etl\.|import etl\.'
      expect: 0

  - id: ISO-3
    name: 表隔离
    rule: general 族业务表均为独立表名（etl_general_* / doc_chunk_general / general_doc_etl_step_cache / outbox），无外键关联历史/PDF 表
    spec:
      primitive: json_field
      target: storage.sqlite.tables
      fields: [chunk, step_cache, outbox, failed, fatal, retry_dead, empty_chunk]
      note: 7 个表名键必须全部存在于 storage.yaml

  - id: ISO-4
    name: 存储隔离
    rule: general LanceDB 目录(general_doc_db)/BM25 目录(general_bm25)/tmp 目录(general_upload) 与历史索引及 pdf_storage/files/ 物理分离
    spec:
      primitive: json_field
      target: storage
      fields: [lancedb.uri, bm25_index_dir, tmp_dir]
      note: 三类路径键必须登记；值含 general_ 前缀路径由执行器消费

  - id: ISO-5
    name: 配置隔离
    rule: contract_rules/ 仅由 engine/rules_loader.py 读取；执行器/内核禁止直接 open 规则表（防第二读取入口）
    spec:
      primitive: grep_count
      target: engine/general/*.py
      pattern: 'contract_rules'
      expect: 0
      note: general_stages.py/kernel.py/stages.py 同样禁止出现 contract_rules 字面量（CI 对 engine/*.py 排除 rules_loader.py 后同断言）

  - id: ISO-6
    name: 白名单拦截
    rule: general_validate 显式拒绝 .pdf（pdf 必须存在于 validation.yaml blocklist，且不得出现在 whitelist）
    spec:
      primitive: json_field
      target: validation
      fields: [whitelist, blocklist]
      note: CI 进一步断言 'pdf' ∈ blocklist 且 'pdf' ∉ whitelist（值级断言由 spec 执行器展开）
