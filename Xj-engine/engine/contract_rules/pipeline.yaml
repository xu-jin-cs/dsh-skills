# pipeline.yaml — 步骤链定义唯一真源（状态机规则化，不再有 state_machine.py 模块）
# standalone 版：历史节已裁（内核仅 general 族），general 六步链为唯一步骤链

general:
  # general 族 6 个参数化执行器，顺序固定（台账 表1-#21 改造：对齐 stages 注册命名）
  steps:
    - name: general_validate
      # 读 validation.yaml 执行白名单/魔数/大小分层/文件名清洗/MD5去重；
      # 违例按 retry_exception.yaml 映射分流（reject/fatal/异常队列）
      writes_ctx: [file_md5, file_info, is_duplicate]
    - name: general_parse
      # 按 parsing.yaml format_groups 路由到 engine/general/parsers.py；降级链/编码序读表
      writes_ctx: [raw_document, doc_unique_id]
    - name: general_clean
      # 按 cleaning.yaml normalize+redundancy 执行；protected_markers 行跳过冗余过滤
      writes_ctx: [clean_text, section_nodes]
    - name: general_chunk
      # 按 chunking.yaml 语义优先分片；chunk_id 按表中 general 族公式生成
      writes_ctx: [chunk_list, chunk_ids]
    - name: general_write
      # embed(bge-m3 1024) 批量向量化 → SQLite+LanceDB 双写 → outbox 记账（表名/路径读 storage.yaml）
      writes_ctx: [vector_write_result, outbox_record_id]
    - name: general_post
      # BM25 重建 + 按 validation.yaml tmp_retention 双侧分流回收临时文件
      writes_ctx: [index_status, temp_clean_count]
  default_chain:
    - general_validate
    - general_parse
    - general_clean
    - general_chunk
    - general_write
    - general_post
  # 自定义链缺失 general_validate 前置 → code=error（契约 §2.4，内核消费本键）
  require_first_step: general_validate
  # 断点续跑：每步完成写 general_doc_etl_step_cache，恢复时元数据从主表补齐（契约 §2.5）
  step_cache_table: general_doc_etl_step_cache
