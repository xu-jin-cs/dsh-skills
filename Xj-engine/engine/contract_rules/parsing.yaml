# parsing.yaml — 多格式解析规则唯一真源
# 迁移依据：规则迁移台账 表1-#10~#13（general_etl.yaml parsing 节全量搬运）
# 行为不数据化：parser 提取逻辑只登记 impl 注册条目指向 engine/general/parsers.py

# 台账 表1-#10：5 格式分组（组→parser 实现映射见 parser_impl 注册条目）
# 2026-08-17 用户裁定：json 归入 text 组（随 validation.yaml 白名单扩列，复用 text_parser）
format_groups:
  text: [txt, md, json]
  word: [docx, doc, wps]
  spreadsheet: [xlsx, xls, csv]
  presentation: [pptx, ppt]
  html: [html, htm]

# 台账 表1-#11：parser 版本（写入 chunk meta 用于溯源；键=格式组名，parsers.py 消费）
parser_versions:
  text: "1.0.0"
  word: "1.0.0"
  office_binary: "1.0.0"
  spreadsheet: "1.0.0"
  presentation: "1.0.0"
  html: "1.0.0"

# 注册条目：格式组 → 解析实现（行为资产，规则表只登记指向）
parser_impl:
  text: engine.general.parsers
  word: engine.general.parsers
  spreadsheet: engine.general.parsers
  presentation: engine.general.parsers
  html: engine.general.parsers

# 台账 表1-#12（改造）+ T3 默认裁定：macOS textutil 优先，libreoffice 次之；
# csv 编码探测序 utf-8-sig → utf-8 → gbk → gb2312
fallback:
  binary_word_tool: textutil
  binary_presentation_tool: textutil
  secondary_tool: libreoffice
  binary_convert_tools: [textutil, libreoffice]   # 执行器按序降级（parsers.py 消费键）
  convert_timeout_seconds: 120                    # 单次外部工具转换超时（U3 集成补登，parsers.py 消费键）
  csv_encoding_detect_order: [utf-8-sig, utf-8, gbk, gb2312]

# 台账 表1-#13：各格式子规则（纯数据，全量搬运）
markdown:
  heading_levels: [1, 2, 3, 4, 5, 6]
  keep_code_blocks: true
  keep_blockquotes: true
  drop_horizontal_rules: true

word:
  heading_styles: ["Heading 1", "Heading 2", "Heading 3", "Heading 4"]
  drop_headers: true
  drop_footers: true
  drop_comments: true
  drop_revisions: true
  fill_merged_cells: true
  filter_pure_number_tables: false

spreadsheet:
  header_candidate_rows: 2
  empty_row_drop: true
  max_rows_per_sheet: 20000
  output_format: key_value

presentation:
  keep_notes: false
  drop_master_text: true
  drop_footer_logos: true

html:
  node_blacklist: [script, style, comment, iframe, nav, aside, footer]
  heading_tags: [h1, h2, h3, h4, h5, h6]
  keep_img_alt: false
  unescape_html: true
