# cleaning.yaml — 专属清洗规则唯一真源
# 迁移依据：规则迁移台账 表1-#14~#16、表2-H4(constants PROTECTED_MARKERS)
# 冲突裁定：C2(保护标记 7 个唯一在本表)

# 台账 表1-#14：normalize 7 开关
normalize:
  nfkc: true
  newline_to_lf: true
  unescape_html_md: true
  fullwidth_halfwidth: true
  collapse_spaces: true
  space_threshold: 4
  strip_line_edges: true

# 台账 表1-#15：redundancy 冗余过滤（enabled + 5 项判定参数）
redundancy:
  enabled: true
  consecutive_duplicate_lines: 3
  drop_pure_number_symbol_lines: true
  pure_number_symbol_max_len: 15
  drop_empty_lines: true
  drop_single_letter_index: true
  drop_long_separator_lines: true

# 台账 表1-#16 + 表2-H4：7 个受保护结构标记（含标记的行跳过冗余过滤）
protected_markers:
  - "[TABLE_START]"
  - "[TABLE_END]"
  - "[SLIDE_START]"
  - "[SLIDE_END]"
  - "[CODE_START]"
  - "[CODE_END]"
  - "[HEADER]"

# 台账 表1-#16 附属：边界保护行为开关
boundary_protection:
  preserve_table_newlines: true
  preserve_heading_gaps: true
