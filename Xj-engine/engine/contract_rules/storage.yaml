# storage.yaml — 存储/向量化/路径规则唯一真源（standalone 版：历史族四节已裁，路径相对包根）
# 迁移依据：规则迁移台账 表1-#1(defaults 改造)/#2(minio)/#18(embedding 改造 C5)/
#           #19(mysql 6+1 表名)/#20(lancedb 改造)
# 冲突裁定：C5 —— embedding 统一 BAAI/bge-m3 1024 维（embed.py 既有资产，旧 384 不迁移 T2）

# 台账 表1-#1（改造）：kb_space_id 概念并入 tenant_id，只留 tenant 单维度
defaults:
  enable: true
  default_dataset_id: general_doc
  default_tenant_id: default
  log_level: INFO

# 台账 表1-#18（改造 C5）：BAAI/bge-m3 · 1024 维 · mps（engine/embed.py 既有资产复用）
embedding:
  model_name: BAAI/bge-m3
  dimension: 1024
  device: mps
  batch_size: 50
  max_retries: 5
  retry_interval_seconds: 10
  empty_text_skip: true

# 台账 表1-#20（改造）：general 族 LanceDB（与历史族旧向量库物理分离）
lancedb:
  uri: ./data/vector/general_doc_db
  table: general_doc_chunks
  vector_dim: 1024

# 台账 表1-#19：业务 SQLite 表名（新引擎落 runtime/general_etl.db，与 etl_engine.db 双分表）
sqlite:
  path: ./data/general_etl.db
  tables:
    chunk: doc_chunk_general
    step_cache: general_doc_etl_step_cache
    outbox: outbox
    failed: etl_general_failed
    fatal: etl_general_fatal
    retry_dead: etl_general_retry_dead
    empty_chunk: etl_general_empty_chunk

# 通用 BM25 索引落盘目录（*.pkl，与历史族旧索引分离）
bm25_index_dir: ./data/bm25

# 临时文件目录（tmp_retention 见 validation.yaml）
tmp_dir: ./data/tmp/general_upload

# 台账 表1-#2 + T1 默认裁定：MinIO 层不保留（本地 mirror，引擎自包含），前缀登记备查
minio:
  enabled: false
  source_prefix: general_doc_source/
  tmp_prefix: general_doc_tmp/
  fallback_local_dir: data/general_doc_local
