# retry_exception.yaml — 异常三级分类映射表 / 重试策略 / 告警阈值 唯一真源
# 迁移依据：规则迁移台账 表1-#22(retry_policy)/#24(alert_thresholds)、
#           表2-H1(exception_handler.py L59-60 硬编码分类集合 + 默认映射)
# category 三分类：resource(资源类可重试) / content(内容类不可恢复) / business(业务规则拒绝)
# queue 落表：etl_general_failed(重试) / etl_general_fatal(死信) / etl_general_retry_dead(耗尽)
#             / etl_general_empty_chunk(空内容分流)

# 台账 表2-H1：吸收旧引擎 RETRIABLE_TYPES / FATAL_TYPES 全集 + ValidationException/EmptyContentException
classification:
  # ── 旧 RETRIABLE_TYPES → resource / etl_general_failed / 3×30s ──
  RetriableException:  {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}
  ReadTimeout:         {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}
  EmbeddingTimeout:    {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}
  OOM:                 {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}
  ConnectionError:     {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}
  # ── 旧 FATAL_TYPES → content(1×0s) / business(0 次)，均落 etl_general_fatal ──
  FatalException:      {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  CorruptFile:         {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  MagicMismatch:       {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  ParserCrash:         {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  Encrypted:           {category: business, queue: etl_general_fatal, max_retries: 0, backoff_seconds: 0}
  MacroEnabled:        {category: business, queue: etl_general_fatal, max_retries: 0, backoff_seconds: 0}
  SizeExceeded:        {category: business, queue: etl_general_fatal, max_retries: 0, backoff_seconds: 0}
  FormatNotSupported:  {category: business, queue: etl_general_fatal, max_retries: 0, backoff_seconds: 0}
  # ── 旧引擎派生分类（classify 返回 validation/empty 的分流语义保留）──
  ValidationException:   {category: business, queue: etl_general_fatal, max_retries: 0, backoff_seconds: 0}
  EmptyContentException: {category: content, queue: etl_general_empty_chunk, max_retries: 0, backoff_seconds: 0}

# 台账 表2-H1：表尾 defaults 节——ValueError/FileNotFoundError → content/fatal；
# 未登记异常 → resource/retriable
defaults:
  ValueError:         {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  FileNotFoundError:  {category: content, queue: etl_general_fatal, max_retries: 1, backoff_seconds: 0}
  unregistered:       {category: resource, queue: etl_general_failed, max_retries: 3, backoff_seconds: 30}

# 台账 表1-#22：三类重试策略（resource 3×30s / content 1×0s / business 0 次）
# max_retries 允许 payload.options 覆盖（改造清单 §2.1 白名单示例 retry_max_times）
retry_policy:
  resource:
    max_retries: {value: 3, overridable: true}
    backoff_seconds: 30
  content:
    max_retries: {value: 1, overridable: true}
    backoff_seconds: 0
  business:
    max_retries: {value: 0, overridable: true}
    backoff_seconds: 0

# 台账 表1-#24：metrics.alert_thresholds 全量搬运
alert_thresholds:
  parse_failure_rate: 0.01
  p95_step_duration_seconds: 8.0
  degraded_parse_spike_count: 10
  empty_chunk_spike_count: 10

# 台账 表1-#24：metrics 名称注册条目（新引擎 metrics 面从简，只登记不实现）
metrics:
  counters:
    - general_etl_files_total
    - general_etl_chunks_total
    - general_etl_failures_total
    - general_etl_degraded_parses_total
    - general_etl_empty_chunks_total
  histograms:
    - general_etl_step_duration_seconds
