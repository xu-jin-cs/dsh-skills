# chunking.yaml — 语义分片规则唯一真源
# 迁移依据：规则迁移台账 表1-#17、表2-H3(chunk_id 两族公式)/H4(constants BLOCK_TYPES/DOC_ID_PREFIX)

# 台账 表1-#17：语义优先分片全套参数
strategy: semantic_priority
max_token:
  value: 1200
  overridable: true          # options 可覆盖（改造清单 §2.1 白名单示例）
min_token: 100
overlap_token: 200
table_max_single: 1500
header_levels: [1, 2, 3]
preserve:
  - table
  - code_block
  - slide
fallback: sliding_window
merge_small_chunks: true

# 台账 表2-H3：chunk_id 两族公式同表登记（md5 → int64，merge_insert 幂等覆写）
chunk_id_formula:
  general:
    template: "general-etl|{tenant_id}|{doc_unique_id}|{seq}|{clean_text}"
    hash: md5
    cast: int64

# 台账 表2-H4：constants.py BLOCK_TYPES 并入本表
block_types:
  paragraph: para
  table: table
  slide: slide
  code: code
  list: list
  header: title

# 台账 表2-H4：constants.py DOC_ID_PREFIX 并入本表
doc_id_prefix: GD

# 用户提案 2026-08-24（REFORM-GATE 判A：meta_parent_chunk_id_20260824.md；
# 重组逻辑外部化裁定：引擎只落锚，reassembly 见 docs/reassembly_contract.md）
meta_assembly_anchor:
  enabled: true
  field: parent_chunk_id            # meta JSON 内的键名
  anchor: first_chunk               # 锚 = chunk_seq=1 的 chunk_id
  scope: single_file_ingest         # 单文件入库启用
